<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Sohbet Platformu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a1d20; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    /* GİRİŞ EKRANI */
    #login-screen { background: #2b2e33; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    #login-screen h2 { margin-bottom: 20px; color: #4e9f3d; }
    #login-screen input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #444; border-radius: 6px; background: #1a1d20; color: #fff; outline: none; }
    #login-screen button { width: 100%; padding: 12px; background: #4e9f3d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #login-screen button:hover { background: #3e8e2d; }
    #error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

    /* ANA UYGULAMA (GİZLİ) */
    #app-container { display: none; width: 95vw; height: 90vh; background: #2b2e33; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    /* SOL PROFİL */
    .profile-panel { width: 280px; background: #212428; padding: 20px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #333; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: #4e9f3d; display: flex; justify-content: center; align-items: center; font-size: 36px; margin-bottom: 15px; text-transform: uppercase; border: 3px solid #1a1d20; }
    .user-info { text-align: center; width: 100%; }
    .user-info h3 { margin-bottom: 5px; }
    .status { font-size: 12px; color: #4e9f3d; margin-bottom: 20px; display: block; }
    .status-input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1d20; color: #fff; margin-bottom: 10px; font-size: 12px; }
    .logout-btn { margin-top: auto; width: 100%; padding: 10px; background: #d9534f; color: white; border: none; border-radius: 6px; cursor: pointer; }

    /* ORTA CHAT */
    .chat-panel { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 15px 20px; background: #212428; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .search-box input { padding: 8px 12px; background: #1a1d20; border: 1px solid #444; border-radius: 20px; color: white; outline: none; width: 220px; font-size: 13px; }
    
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { background: #3a3f47; padding: 10px 14px; border-radius: 8px; max-width: 70%; width: fit-content; }
    .message.mine { background: #1e5128; align-self: flex-end; }
    .message .meta { font-size: 11px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
    .message .text { font-size: 14px; word-break: break-word; }

    .chat-input-area { padding: 15px; background: #212428; border-top: 1px solid #333; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 12px; background: #1a1d20; border: 1px solid #444; border-radius: 6px; color: white; outline: none; }
    .chat-input-area button { padding: 12px 24px; background: #4e9f3d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-screen">
    <h2>Özel Sohbet Girişi</h2>
    <input type="text" id="username-input" placeholder="Kullanıcı Adınız">
    <input type="password" id="password-input" placeholder="Giriş Şifresi">
    <button onclick="login()">Giriş Yap</button>
    <p id="error-msg">Hatalı şifre veya kullanıcı adı!</p>
  </div>

  <!-- ANA CHAT EKRANI -->
  <div id="app-container">
    <!-- SOL PROFİL -->
    <div class="profile-panel">
      <div class="avatar" id="avatar-letter">?</div>
      <div class="user-info">
        <h3 id="display-name">Kullanıcı</h3>
        <span class="status">● Çevrimiçi</span>
        <input type="text" id="status-text" class="status-input" placeholder="Durum mesajı yaz..." onchange="updateStatus()">
      </div>
      <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
    </div>

    <!-- ORTA CHAT -->
    <div class="chat-panel">
      <div class="chat-header">
        <h3>Genel Sohbet Odası</h3>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Mesajlarda ara..." onkeyup="searchMessages()">
        </div>
      </div>

      <div class="chat-messages" id="message-list">
        <!-- Örnek Hoşgeldin Mesajı -->
        <div class="message">
          <div class="meta"><span>Sistem</span><span>Şimdi</span></div>
          <div class="text">Özel sohbet odasına hoş geldiniz!</div>
        </div>
      </div>

      <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
      </div>
    </div>
  </div>

  <script>
    // Sadece sizin izin verdiğiniz kişilerin şifreleri (KULLANICI ADI : ŞİFRE)
    const ALLOWED_USERS = {
      "ahmet": "1234",
      "mehmet": "5678",
      "ayse": "9999",
      "admin": "ozelsifre"
    };

    let currentUser = "";

    function login() {
      const user = document.getElementById('username-input').value.toLowerCase().trim();
      const pass = document.getElementById('password-input').value;
      const errorMsg = document.getElementById('error-msg');

      if (ALLOWED_USERS[user] && ALLOWED_USERS[user] === pass) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        
        // Profil bilgilerini doldur
        document.getElementById('display-name').textContent = user.toUpperCase();
        document.getElementById('avatar-letter').textContent = user.charAt(0);
        
        loadMessages();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function logout() {
      location.reload();
    }

    function updateStatus() {
      const status = document.getElementById('status-text').value;
      alert('Durum güncellendi: ' + status);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const msgData = { user: currentUser, text: text, time: timeStr };
      
      // Yerel depolamaya kaydet
      let messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
      messages.push(msgData);
      localStorage.setItem('chat_messages', JSON.stringify(messages));

      input.value = '';
      loadMessages();
    }

    function loadMessages() {
      const list = document.getElementById('message-list');
      let messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
      
      let html = `
        <div class="message">
          <div class="meta"><span>Sistem</span><span>Sürekli</span></div>
          <div class="text">Özel sohbet odasına hoş geldiniz!</div>
        </div>
      `;

      messages.forEach(msg => {
        const isMine = msg.user === currentUser;
        html += `
          <div class="message ${isMine ? 'mine' : ''}">
            <div class="meta"><span>${msg.user.toUpperCase()}</span><span>${msg.time}</span></div>
            <div class="text">${escapeHtml(msg.text)}</div>
          </div>
        `;
      });

      list.innerHTML = html;
      list.scrollTop = list.scrollHeight;
    }

    function searchMessages() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const msgs = document.querySelectorAll('.chat-messages .message');

      msgs.forEach(msg => {
        const text = msg.textContent.toLowerCase();
        msg.style.display = text.includes(query) ? 'block' : 'none';
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
