<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Sohbet Platformu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0e14; color: #e1e7ed; height: 100vh; overflow: hidden; }

    /* GİRİŞ EKRANI */
    #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0e14; }
    .login-box { background: #151921; padding: 40px; border-radius: 16px; width: 360px; border: 1px solid #232936; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .login-box h2 { color: #3b82f6; margin-bottom: 24px; font-size: 24px; }
    .login-box input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #232936; border-radius: 8px; background: #0b0e14; color: #fff; outline: none; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .login-box button:hover { background: #1d4ed8; }
    #error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

    /* UYGULAMA ARAYÜZÜ */
    #app-container { display: none; height: 100vh; width: 100vw; position: relative; }
    
    /* 1. SOL DAR MENÜ */
    .nav-sidebar { width: 70px; background: #10141d; border-right: 1px solid #1e2430; display: flex; flex-direction: column; align-items: center; padding: 20px 0; justify-content: space-between; }
    .logo-icon { width: 40px; height: 40px; background: #2563eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; margin-bottom: 30px; }
    .nav-menu { display: flex; flex-direction: column; gap: 20px; width: 100%; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748b; text-decoration: none; font-size: 11px; cursor: pointer; padding: 10px 0; width: 100%; }
    .nav-item i { font-size: 18px; }
    .nav-item.active, .nav-item:hover { color: #3b82f6; border-left: 3px solid #3b82f6; }
    .user-avatar-small { width: 38px; height: 38px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; }

    /* 2. ANA SOHBET ALANI */
    .main-chat-area { flex: 1; display: flex; flex-direction: column; background: #0b0e14; }
    .chat-header { height: 70px; border-bottom: 1px solid #1e2430; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; background: #151921; }
    .header-user-info { display: flex; align-items: center; gap: 12px; }
    .header-actions { display: flex; gap: 16px; color: #94a3b8; font-size: 18px; cursor: pointer; }
    .header-actions i:hover { color: #fff; }

    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message-row { display: flex; flex-direction: column; max-width: 60%; }
    .message-row.mine { align-self: flex-end; }
    .message-row.other { align-self: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .message-row.mine .bubble { background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .message-row.other .bubble { background: #1e2430; color: #e1e7ed; border-bottom-left-radius: 4px; }
    .time-stamp { font-size: 10px; color: #64748b; margin-top: 4px; align-self: flex-end; }

    .chat-input-bar { padding: 20px; background: #151921; border-top: 1px solid #1e2430; display: flex; align-items: center; gap: 12px; }
    .input-wrapper { flex: 1; background: #0b0e14; border: 1px solid #1e2430; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 14px; }
    .input-wrapper i { color: #64748b; cursor: pointer; font-size: 18px; }
    .input-wrapper i:hover { color: #fff; }
    .send-btn { width: 40px; height: 40px; background: #2563eb; border: none; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .send-btn:hover { background: #1d4ed8; }

    /* 3. SAĞ PANEL */
    .right-sidebar { width: 320px; background: #151921; border-left: 1px solid #1e2430; display: flex; flex-direction: column; }
    
    .profile-card-large { text-align: center; border-bottom: 1px solid #1e2430; padding: 20px; }
    .profile-avatar-large { width: 70px; height: 70px; border-radius: 50%; background: #2563eb; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    .profile-info-section { display: flex; flex-direction: column; gap: 8px; font-size: 12px; margin-top: 12px; text-align: left; }
    .info-label { color: #64748b; }
    .info-value { color: #e1e7ed; font-weight: 500; }

    .chat-list-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-list-header { padding: 16px 20px; border-bottom: 1px solid #1e2430; font-size: 16px; font-weight: 600; background: #11151c; }
    .chat-list { overflow-y: auto; flex: 1; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #1a202c; transition: 0.2s; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1e2430; }
    .chat-item-avatar { width: 38px; height: 38px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; font-size: 14px; }
    
    /* DURUM NOKTALARI */
    .status-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #151921; }
    .status-dot.online { background: #22c55e; }
    .status-dot.offline { background: #64748b; }

    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .chat-item-lastmsg { font-size: 12px; color: #94a3b8; }
    
    /* OKUNMAMIŞ MESAJ ROZETİ */
    .unread-badge { background: #2563eb; color: #fff; font-size: 11px; font-weight: bold; border-radius: 10px; padding: 2px 7px; margin-left: auto; }

    /* SAĞ ÜST BİLDİRİM (TOAST) */
    #notification-toast {
      position: absolute;
      top: 20px;
      right: 340px;
      background: #151921;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1000;
      cursor: pointer;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .toast-content { display: flex; flex-direction: column; }
    .toast-title { font-size: 13px; font-weight: bold; color: #fff; }
    .toast-body { font-size: 12px; color: #94a3b8; margin-top: 2px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Özel Sohbet Girişi</h2>
      <input type="text" id="username-input" placeholder="Kullanıcı Adı" onkeydown="if(event.key==='Enter') document.getElementById('password-input').focus()">
      <input type="password" id="password-input" placeholder="Şifre" onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()">Giriş Yap</button>
      <p id="error-msg">Hatalı kullanıcı adı veya şifre!</p>
    </div>
  </div>

  <!-- UYGULAMA ANA ALANI -->
  <div id="app-container">
    
    <!-- ÜST POP-UP BİLDİRİM KARTI -->
    <div id="notification-toast" onclick="clickNotification()">
      <div class="toast-avatar" id="toast-avatar">A</div>
      <div class="toast-content">
        <div class="toast-title" id="toast-title">Yeni Mesaj</div>
        <div class="toast-body" id="toast-body">Mesaj içeriği...</div>
      </div>
    </div>

    <!-- 1. SOL NAVİGASYON -->
    <nav class="nav-sidebar">
      <div>
        <div class="logo-icon">M</div>
        <div class="nav-menu">
          <a class="nav-item active"><i class="fa-solid fa-comment"></i>Sohbet</a>
          <a class="nav-item"><i class="fa-solid fa-user"></i>Kişiler</a>
          <a class="nav-item"><i class="fa-solid fa-user-group"></i>Gruplar</a>
          <a class="nav-item"><i class="fa-solid fa-gear"></i>Ayarlar</a>
        </div>
      </div>
      <div class="user-avatar-small" id="nav-user-avatar" onclick="logout()" title="Çıkış Yap">?</div>
    </nav>

    <!-- 2. ORTA SOHBET ALANI -->
    <main class="main-chat-area">
      <div class="chat-header">
        <div class="header-user-info">
          <div class="chat-item-avatar" id="chat-header-avatar">G</div>
          <div>
            <div style="font-weight: 600;" id="chat-header-name">Genel Sohbet Odası</div>
            <div style="font-size: 12px;" id="chat-header-status">● Yükleniyor...</div>
          </div>
        </div>
        <div class="header-actions">
          <i class="fa-solid fa-phone"></i>
          <i class="fa-solid fa-video"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
      </div>

      <div class="messages-container" id="message-list"></div>

      <div class="chat-input-bar">
        <div class="input-wrapper">
          <i class="fa-regular fa-face-smile"></i>
          <input type="text" id="message-input" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
          <i class="fa-solid fa-paperclip"></i>
          <i class="fa-regular fa-image"></i>
        </div>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>

    <!-- 3. SAĞ PANEL -->
    <aside class="right-sidebar">
      <div class="profile-card-large">
        <div class="profile-avatar-large" id="profile-avatar-big">?</div>
        <h3 id="profile-name-big" style="font-size: 16px;">Kullanıcı</h3>
        <span style="font-size: 11px;" id="profile-status-text">● Çevrim Dışı</span>

        <div class="profile-info-section">
          <div>
            <span class="info-label">Kullanıcı Adı: </span>
            <span class="info-value" id="profile-username-val">@kullanici</span>
          </div>
          <div>
            <span class="info-label">Durum: </span>
            <span class="info-value">Özel chat platformu üyesi</span>
          </div>
        </div>
      </div>

      <div class="chat-list-panel">
        <div class="chat-list-header">Mesajlar</div>
        <div class="chat-list" id="users-list"></div>
      </div>
    </aside>
  </div>

  <script>
    const ALLOWED_USERS = {
      "ahmet": "1234",
      "mehmet": "5678",
      "ayse": "9999",
      "admin": "ozelsifre"
    };

    let currentUser = "";
    let activeTarget = "genel";
    let unreadCounts = {};
    let lastSeenMsgCount = {};
    let toastSenderTarget = "";

    // KALBİN ATMA HIZI (ÇEVRİM İÇİ SİNYALİ)
    function updateHeartbeat() {
      if (!currentUser) return;
      const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
      onlineData[currentUser] = Date.now();
      localStorage.setItem('online_users', JSON.stringify(onlineData));
    }

    function isUserOnline(username) {
      const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
      const lastSeen = onlineData[username];
      if (!lastSeen) return false;
      // Son 10 saniye içinde sinyal vermişse çevrim içi say
      return (Date.now() - lastSeen) < 10000;
    }

    function getOnlineUserCount() {
      let count = 0;
      Object.keys(ALLOWED_USERS).forEach(user => {
        if (isUserOnline(user)) count++;
      });
      return count;
    }

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {
        console.log("Ses çalınamadı:", e);
      }
    }

    function showNotification(sender, text) {
      toastSenderTarget = sender;
      document.getElementById('toast-avatar').textContent = sender.charAt(0).toUpperCase();
      document.getElementById('toast-title').textContent = sender.toUpperCase() + " yeni bir mesaj gönderdi";
      document.getElementById('toast-body').textContent = text;
      
      const toast = document.getElementById('notification-toast');
      toast.style.display = 'flex';
      
      playNotificationSound();

      setTimeout(() => {
        toast.style.display = 'none';
      }, 4000);
    }

    function clickNotification() {
      if (toastSenderTarget) {
        selectChat(toastSenderTarget);
        document.getElementById('notification-toast').style.display = 'none';
      }
    }

    function login() {
      const u = document.getElementById('username-input').value.toLowerCase().trim();
      const p = document.getElementById('password-input').value;

      if (ALLOWED_USERS[u] && ALLOWED_USERS[u] === p) {
        currentUser = u;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        
        document.getElementById('nav-user-avatar').textContent = u.charAt(0).toUpperCase();

        updateHeartbeat();
        setInterval(updateHeartbeat, 3000);

        renderUserList();
        selectChat('genel');

        setInterval(checkNewMessages, 1000);
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    function logout() {
      if (currentUser) {
        const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
        delete onlineData[currentUser];
        localStorage.setItem('online_users', JSON.stringify(onlineData));
      }
      location.reload();
    }

    window.addEventListener('beforeunload', () => {
      if (currentUser) {
        const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
        delete onlineData[currentUser];
        localStorage.setItem('online_users', JSON.stringify(onlineData));
      }
    });

    function selectChat(targetUser) {
      activeTarget = targetUser;
      unreadCounts[targetUser] = 0;

      updateHeaderAndProfile();
      renderUserList();

      const key = getStorageKeyFor(targetUser);
      let msgs = JSON.parse(localStorage.getItem(key) || '[]');
      lastSeenMsgCount[key] = msgs.length;

      loadMessages();
    }

    function updateHeaderAndProfile() {
      const headerAvatar = document.getElementById('chat-header-avatar');
      const headerName = document.getElementById('chat-header-name');
      const headerStatus = document.getElementById('chat-header-status');

      const profileAvatar = document.getElementById('profile-avatar-big');
      const profileName = document.getElementById('profile-name-big');
      const profileUsername = document.getElementById('profile-username-val');
      const profileStatus = document.getElementById('profile-status-text');

      if (activeTarget === 'genel') {
        const onlineCount = getOnlineUserCount();
        headerAvatar.textContent = 'G';
        headerName.textContent = 'Genel Sohbet Odası';
        headerStatus.innerHTML = `<span style="color: #22c55e;">● ${onlineCount} Kullanıcı Çevrim İçi</span>`;

        profileAvatar.textContent = currentUser.charAt(0).toUpperCase();
        profileName.textContent = currentUser.toUpperCase();
        profileUsername.textContent = '@' + currentUser;
        profileStatus.innerHTML = `<span style="color: #22c55e;">● Çevrim İçi</span>`;
      } else {
        const online = isUserOnline(activeTarget);
        headerAvatar.textContent = activeTarget.charAt(0).toUpperCase();
        headerName.textContent = activeTarget.toUpperCase() + ' ile Özel Sohbet';
        headerStatus.innerHTML = online 
          ? `<span style="color: #22c55e;">● Çevrim İçi</span>` 
          : `<span style="color: #64748b;">● Çevrim Dışı</span>`;

        profileAvatar.textContent = activeTarget.charAt(0).toUpperCase();
        profileName.textContent = activeTarget.toUpperCase();
        profileUsername.textContent = '@' + activeTarget;
        profileStatus.innerHTML = online 
          ? `<span style="color: #22c55e;">● Çevrim İçi</span>` 
          : `<span style="color: #64748b;">● Çevrim Dışı</span>`;
      }
    }

    function renderUserList() {
      const container = document.getElementById('users-list');
      
      let genelUnread = unreadCounts['genel'] || 0;
      let html = `
        <div class="chat-item ${activeTarget === 'genel' ? 'active' : ''}" onclick="selectChat('genel')">
          <div class="chat-item-avatar">
            G
            <div class="status-dot online"></div>
          </div>
          <div class="chat-item-info">
            <div class="chat-item-name">GENEL SOHBET</div>
            <div class="chat-item-lastmsg">${getOnlineUserCount()} kişi aktif</div>
          </div>
          ${genelUnread > 0 ? `<div class="unread-badge">${genelUnread}</div>` : ''}
        </div>
      `;

      Object.keys(ALLOWED_USERS).forEach(user => {
        if (user !== currentUser) {
          let count = unreadCounts[user] || 0;
          let online = isUserOnline(user);
          html += `
            <div class="chat-item ${activeTarget === user ? 'active' : ''}" onclick="selectChat('${user}')">
              <div class="chat-item-avatar">
                ${user.charAt(0).toUpperCase()}
                <div class="status-dot ${online ? 'online' : 'offline'}"></div>
              </div>
              <div class="chat-item-info">
                <div class="chat-item-name">${user.toUpperCase()}</div>
                <div class="chat-item-lastmsg" style="color: ${online ? '#22c55e' : '#64748b'}">${online ? 'Çevrim İçi' : 'Çevrim Dışı'}</div>
              </div>
              ${count > 0 ? `<div class="unread-badge">${count}</div>` : ''}
            </div>
          `;
        }
      });

      container.innerHTML = html;
    }

    function getStorageKeyFor(target) {
      if (target === 'genel') return 'chat_genel';
      const pair = [currentUser, target].sort().join('_');
      return 'chat_' + pair;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const msgData = { user: currentUser, text: text, time: timeStr };
      const key = getStorageKeyFor(activeTarget);

      let messages = JSON.parse(localStorage.getItem(key) || '[]');
      messages.push(msgData);
      localStorage.setItem(key, JSON.stringify(messages));

      lastSeenMsgCount[key] = messages.length;

      input.value = '';
      loadMessages();
    }

    function checkNewMessages() {
      updateHeaderAndProfile();
      renderUserList();
      loadMessages();

      const targets = ['genel', ...Object.keys(ALLOWED_USERS).filter(u => u !== currentUser)];

      targets.forEach(target => {
        const key = getStorageKeyFor(target);
        let msgs = JSON.parse(localStorage.getItem(key) || '[]');
        let prevCount = lastSeenMsgCount[key] || 0;

        if (msgs.length > prevCount) {
          const lastMsg = msgs[msgs.length - 1];
          if (lastMsg.user !== currentUser && target !== activeTarget) {
            unreadCounts[target] = (unreadCounts[target] || 0) + (msgs.length - prevCount);
            showNotification(lastMsg.user, lastMsg.text);
            renderUserList();
          }
          lastSeenMsgCount[key] = msgs.length;
        }
      });
    }

    function loadMessages() {
      const list = document.getElementById('message-list');
      const key = getStorageKeyFor(activeTarget);
      let messages = JSON.parse(localStorage.getItem(key) || '[]');
      
      lastSeenMsgCount[key] = messages.length;

      let html = '';
      messages.forEach(msg => {
        const isMine = msg.user === currentUser;
        html += `
          <div class="message-row ${isMine ? 'mine' : 'other'}">
            <div class="bubble">${escapeHtml(msg.text)}</div>
            <div class="time-stamp">${msg.user.toUpperCase()} • ${msg.time}</div>
          </div>
        `;
      });

      if (list.innerHTML !== html) {
        list.innerHTML = html;
        list.scrollTop = list.scrollHeight;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
