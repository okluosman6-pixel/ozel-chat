<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Sohbet Platformu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0e14; color: #e1e7ed; height: 100vh; overflow: hidden; }

    /* GİRİŞ EKRANI */
    #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0e14; }
    .login-box { background: #151921; padding: 40px; border-radius: 16px; width: 360px; border: 1px solid #232936; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .login-box h2 { color: #3b82f6; margin-bottom: 24px; font-size: 24px; }
    .login-box input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #232936; border-radius: 8px; background: #0b0e14; color: #fff; outline: none; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .login-box button:hover { background: #1d4ed8; }
    #error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

    /* UYGULAMA ARAYÜZÜ */
    #app-container { display: none; height: 100vh; width: 100vw; position: relative; }
    
    /* 1. SOL DAR MENÜ */
    .nav-sidebar { width: 85px; background: #10141d; border-right: 1px solid #1e2430; display: flex; flex-direction: column; align-items: center; padding: 20px 0; justify-content: space-between; }
    .logo-icon { width: 40px; height: 40px; background: #2563eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; margin-bottom: 30px; }
    .nav-menu { display: flex; flex-direction: column; gap: 15px; width: 100%; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748b; text-decoration: none; font-size: 11px; cursor: pointer; padding: 10px 0; width: 100%; transition: 0.2s; }
    .nav-item i { font-size: 18px; }
    .nav-item.active, .nav-item:hover { color: #3b82f6; border-left: 3px solid #3b82f6; }

    /* ÇIKIŞ BUTONU */
    .exit-btn {
      width: 75px; padding: 8px 4px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; color: #ef4444; font-size: 10px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; transition: all 0.2s ease; margin-bottom: 10px;
    }
    .exit-btn:hover { background: #ef4444; color: #fff; }
    .exit-btn i { font-size: 14px; }

    /* PANEL YÖNETİMİ */
    .content-panel { flex: 1; display: none; background: #0b0e14; padding: 30px; overflow-y: auto; }
    .content-panel.active { display: flex; flex-direction: column; }
    .panel-title { font-size: 22px; font-weight: bold; color: #3b82f6; margin-bottom: 20px; }

    /* FORM ÖĞELERİ VE KARTLAR */
    .settings-card { background: #151921; border: 1px solid #1e2430; border-radius: 12px; padding: 16px; margin-bottom: 16px; transition: 0.2s; }
    .settings-card:hover { border-color: #3b82f6; }
    .settings-header { display: flex; align-items: center; justify-content: space-between; font-weight: bold; cursor: pointer; }
    .sound-select-box { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1e2430; }
    
    /* ÖZEL TOGGLE */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(20px); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .form-group input[type="text"], .form-group input[type="password"], .form-group select { width: 100%; padding: 10px; background: #0b0e14; border: 1px solid #232936; border-radius: 6px; color: #fff; outline: none; font-size: 13px; }
    
    .form-group input[type="file"] {
      width: 100%; padding: 8px; background: #0b0e14; border: 1px dashed #3b82f6; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 12px;
    }
    .form-group input[type="file"]::-webkit-file-upload-button {
      background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 10px;
    }

    .btn-primary { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { padding: 6px 12px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; }
    .btn-danger:hover { background: #ef4444; color: white; }

    /* 2. ANA SOHBET ALANI */
    .main-chat-area { flex: 1; display: flex; flex-direction: column; background: #0b0e14; }
    .chat-header { height: 70px; border-bottom: 1px solid #1e2430; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; background: #151921; }
    .header-user-info { display: flex; align-items: center; gap: 12px; }
    
    .chat-header-actions { display: flex; align-items: center; gap: 15px; position: relative; }
    .chat-header-actions button { background: transparent; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: background-color 0.2s, color 0.2s; font-size: 18px; }
    .chat-header-actions button:hover { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; }

    .menu-container { position: relative; }
    .dropdown-menu { position: absolute; right: 0; top: 45px; background-color: #2a343d; border-radius: 8px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; min-width: 170px; z-index: 100; overflow: hidden; }
    .dropdown-menu.hidden { display: none; }
    .menu-item { padding: 12px 16px; text-align: left; border: none; background: transparent; cursor: pointer; font-size: 14px; width: 100%; transition: background-color 0.2s; }
    .menu-item:hover { background-color: rgba(255, 255, 255, 0.05); }
    
    .white-text { color: #ffffff !important; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .red-text { color: #ff4d4d !important; }

    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message-row { display: flex; flex-direction: column; max-width: 65%; position: relative; }
    .message-row.mine { align-self: flex-end; }
    .message-row.other { align-self: flex-start; }
    
    .message-content-wrapper { display: flex; align-items: flex-end; gap: 8px; }
    .message-row.mine .message-content-wrapper { flex-direction: row-reverse; }

    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .message-row.mine .bubble { background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .message-row.other .bubble { background: #1e2430; color: #e1e7ed; border-bottom-left-radius: 4px; }
    
    .msg-actions { display: flex; gap: 6px; opacity: 0; transition: 0.2s; background: #151921; border: 1px solid #232936; padding: 4px 8px; border-radius: 8px; }
    .message-row:hover .msg-actions { opacity: 1; }
    .msg-action-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; padding: 2px; }
    .msg-action-btn:hover { color: #3b82f6; }
    .msg-action-btn.delete:hover { color: #ef4444; }

    .time-stamp { font-size: 10px; color: #64748b; margin-top: 4px; align-self: flex-end; }

    .chat-input-bar { padding: 20px; background: #151921; border-top: 1px solid #1e2430; display: flex; align-items: center; gap: 12px; }
    .input-wrapper { flex: 1; background: #0b0e14; border: 1px solid #1e2430; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 14px; }
    .input-wrapper i { color: #64748b; cursor: pointer; font-size: 18px; }
    .input-wrapper i:hover { color: #fff; }
    .send-btn { width: 40px; height: 40px; background: #2563eb; border: none; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .send-btn:hover { background: #1d4ed8; }

    /* 3. SAĞ PANEL */
    .right-sidebar { width: 320px; background: #151921; border-left: 1px solid #1e2430; display: flex; flex-direction: column; }
    .profile-card-large { text-align: center; border-bottom: 1px solid #1e2430; padding: 20px; }
    .profile-avatar-large { width: 70px; height: 70px; border-radius: 50%; background: #2563eb; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    .profile-info-section { display: flex; flex-direction: column; gap: 8px; font-size: 12px; margin-top: 12px; text-align: left; }
    .info-label { color: #64748b; }
    .info-value { color: #e1e7ed; font-weight: 500; }

    .chat-list-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-list-header { padding: 16px 20px; border-bottom: 1px solid #1e2430; font-size: 16px; font-weight: 600; background: #11151c; }
    .chat-list { overflow-y: auto; flex: 1; }
    
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #1a202c; transition: 0.2s; position: relative; }
    .chat-item:hover, .chat-item.active { background: #1e2430; }
    
    .chat-item-avatar { width: 38px; height: 38px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; font-size: 14px; }
    
    .status-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #151921; }
    .status-dot.online { background: #22c55e; }
    .status-dot.offline { background: #64748b; }

    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .chat-item-lastmsg { font-size: 12px; color: #94a3b8; }
    .unread-badge { background: #2563eb; color: #fff; font-size: 11px; font-weight: bold; border-radius: 10px; padding: 2px 7px; margin-left: auto; }

    .generic-list-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: #151921; border: 1px solid #1e2430; border-radius: 12px; margin-bottom: 12px; position: relative; }
    .generic-list-item i { font-size: 24px; color: #3b82f6; }

    /* ARAMA MODALI (WEB RTC ÖN İZLEME EKRANI) */
    #call-modal { position: fixed; inset: 0; background: rgba(11, 14, 20, 0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .call-box { background: #151921; border: 1px solid #1e2430; border-radius: 16px; padding: 30px; width: 500px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .call-box h3 { margin-bottom: 15px; color: #3b82f6; font-size: 20px; }
    #video-preview { width: 100%; height: 280px; background: #000; border-radius: 10px; object-fit: cover; margin-bottom: 20px; transform: scaleX(-1); }
    .call-controls { display: flex; justify-content: center; gap: 15px; }
    .call-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .call-btn.end { background: #ef4444; color: white; }
    .call-btn.end:hover { background: #dc2626; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Özel Sohbet Girişi</h2>
      <input type="text" id="username-input" placeholder="Kullanıcı Adı (örn: baris alp)" onkeydown="if(event.key==='Enter') document.getElementById('password-input').focus()">
      <input type="password" id="password-input" placeholder="Şifre" onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()">Giriş Yap</button>
      <p id="error-msg">Hatalı kullanıcı adı veya şifre!</p>
    </div>
  </div>

  <!-- GERÇEK ARAMA PENCERESİ (MODAL) -->
  <div id="call-modal">
    <div class="call-box">
      <h3 id="call-title">Canlı Görüşme</h3>
      <video id="video-preview" autoplay playsinline muted></video>
      <div id="audio-visualizer-text" style="color: #22c55e; margin-bottom: 20px; font-weight: 500; display: none;">🎤 Mikrofon aktif, ses iletiliyor...</div>
      <div class="call-controls">
        <button class="call-btn end" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i> Aramayı Sonlandır</button>
      </div>
    </div>
  </div>

  <!-- UYGULAMA ANA ALANI -->
  <div id="app-container">
    
    <!-- 1. SOL NAVİGASYON -->
    <nav class="nav-sidebar">
      <div>
        <div class="logo-icon">M</div>
        <div class="nav-menu">
          <a class="nav-item active" id="nav-chat" onclick="switchTab('chat')"><i class="fa-solid fa-comment"></i>Sohbet</a>
          <a class="nav-item" id="nav-contacts" onclick="switchTab('contacts')"><i class="fa-solid fa-user"></i>Kişiler</a>
          <a class="nav-item" id="nav-groups" onclick="switchTab('groups')"><i class="fa-solid fa-user-group"></i>Gruplar</a>
          <a class="nav-item" id="nav-settings" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i>Ayarlar</a>
        </div>
      </div>
      
      <button class="exit-btn" onclick="logout()" title="Çıkış Yap">
        <i class="fa-solid fa-door-open"></i>
        <span>Sıkıldıysan kapı orada</span>
      </button>
    </nav>

    <!-- 2. SOHBET ALANI -->
    <main class="main-chat-area" id="panel-chat">
      <div class="chat-header">
        <div class="header-user-info">
          <div class="chat-item-avatar" id="chat-header-avatar">E</div>
          <div>
            <div style="font-weight: 600;" id="chat-header-name">E-Ticaret Sohbeti</div>
            <div style="font-size: 12px;" id="chat-header-status">● Yükleniyor...</div>
          </div>
        </div>

        <div class="chat-header-actions">
          <button id="audioCallBtn" title="Canlı Sesli Görüşme">
            <i class="fa-solid fa-phone"></i>
          </button>
          
          <button id="videoCallBtn" title="Canlı Görüntülü Görüşme">
            <i class="fa-solid fa-video"></i>
          </button>
          
          <div class="menu-container">
            <button id="menuToggleBtn" title="Seçenekler">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

            <div id="dropdownMenu" class="dropdown-menu hidden">
              <button id="renameBtn" class="menu-item white-text">Yeniden Adlandır</button>
              <button id="deleteChatBtn" class="menu-item red-text">Sohbeti Sil</button>
              <button id="blockUserBtn" class="menu-item red-text">Engelle</button>
            </div>
          </div>
        </div>
      </div>

      <div class="messages-container" id="message-list"></div>

      <div class="chat-input-bar">
        <div class="input-wrapper">
          <i class="fa-regular fa-face-smile"></i>
          <input type="text" id="message-input" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
          <i class="fa-solid fa-paperclip"></i>
          <i class="fa-regular fa-image"></i>
        </div>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>

    <!-- KİŞİLER PANELİ -->
    <section class="content-panel" id="panel-contacts">
      <div class="panel-title">Kayıtlı Kişiler</div>
      <div id="contacts-list-container"></div>
    </section>

    <!-- GRUPLAR PANELİ -->
    <section class="content-panel" id="panel-groups">
      <div class="panel-title">Gruplar</div>
      <div id="custom-groups-container"></div>
      <div class="settings-card" style="cursor:default; margin-top: 15px;">
        <div style="font-weight:bold; margin-bottom: 10px;">Yeni Grup Ekle</div>
        <div class="form-group">
          <input type="text" id="new-group-name" placeholder="Grup Adı Yazın...">
        </div>
        <button class="btn-primary" onclick="addNewGroup()">Grubu Oluştur</button>
      </div>
    </section>

    <!-- AYARLAR PANELİ -->
    <section class="content-panel" id="panel-settings">
      <div class="panel-title">Ayarlar</div>
      <div class="settings-card" style="cursor:default;">
        <div style="font-weight:bold; margin-bottom:12px;"><i class="fa-solid fa-id-card" style="margin-right:8px; color:#3b82f6;"></i> Adını Değiştir</div>
        <div class="form-group">
          <label>Görünen Adın:</label>
          <input type="text" id="setting-display-name">
        </div>
        <button class="btn-primary" onclick="updateDisplayName()">Adı Güncelle</button>
      </div>
    </section>

    <!-- 3. SAĞ PANEL -->
    <aside class="right-sidebar">
      <div class="profile-card-large">
        <div class="profile-avatar-large" id="profile-avatar-big">?</div>
        <h3 id="profile-name-big" style="font-size: 16px;">Kullanıcı</h3>
        <span style="font-size: 11px;" id="profile-status-text">● Çevrim Dışı</span>
        <div class="profile-info-section">
          <div>
            <span class="info-label">Kullanıcı Adı: </span>
            <span class="info-value" id="profile-username-val">@kullanici</span>
          </div>
        </div>
      </div>

      <div class="chat-list-panel">
        <div class="chat-list-header">Mesajlar</div>
        <div class="chat-list" id="users-list"></div>
      </div>
    </aside>
  </div>

  <script>
    const DEFAULT_USERS = {
      "baris alp": "1234",
      "batuhan tarran": "5678",
      "admin": "ozelsifre"
    };

    function getUsers() {
      return JSON.parse(localStorage.getItem('app_users')) || DEFAULT_USERS;
    }

    function saveUsers(users) {
      localStorage.setItem('app_users', JSON.stringify(users));
    }

    function getDisplayNames() {
      return JSON.parse(localStorage.getItem('app_display_names')) || {};
    }

    function saveDisplayNames(names) {
      localStorage.setItem('app_display_names', JSON.stringify(names));
    }

    function getDisplayNameFor(username) {
      const names = getDisplayNames();
      return names[username] ? names[username] : username;
    }

    if (!localStorage.getItem('app_users')) {
      saveUsers(DEFAULT_USERS);
    }

    let currentUser = "";
    let activeTarget = "genel";
    let unreadCounts = {};
    let localStream = null;

    function login() {
      const uInput = document.getElementById('username-input').value.trim().toLowerCase();
      const pInput = document.getElementById('password-input').value.trim();
      const users = getUsers();

      if (users[uInput] && users[uInput] === pInput) {
        currentUser = uInput;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        initApp();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    function logout() {
      currentUser = "";
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function initApp() {
      updateHeartbeat();
      setInterval(updateHeartbeat, 3000);
      setInterval(pollData, 1500);
      updateHeaderAndProfile();
      renderUserList();
      selectChat('genel');
    }

    function updateHeaderAndProfile() {
      const displayName = getDisplayNameFor(currentUser);
      document.getElementById('profile-name-big').textContent = displayName.toUpperCase();
      document.getElementById('profile-username-val').textContent = "@" + currentUser;
      document.getElementById('profile-avatar-big').textContent = displayName.charAt(0).toUpperCase();
      document.getElementById('profile-status-text').textContent = "● Çevrim İçi";
      document.getElementById('profile-status-text').style.color = "#22c55e";
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('nav-' + tabName).classList.add('active');

      document.getElementById('panel-chat').style.display = 'none';
      document.getElementById('panel-contacts').classList.remove('active');
      document.getElementById('panel-groups').classList.remove('active');
      document.getElementById('panel-settings').classList.remove('active');

      if (tabName === 'chat') {
        document.getElementById('panel-chat').style.display = 'flex';
      } else {
        document.getElementById('panel-' + tabName).classList.add('active');
      }

      if (tabName === 'contacts') renderContactsPanel();
      if (tabName === 'groups') renderCustomGroups();
      if (tabName === 'settings') prepareSettingsPanel();
    }

    function prepareSettingsPanel() {
      document.getElementById('setting-display-name').value = getDisplayNameFor(currentUser);
    }

    function updateDisplayName() {
      const newName = document.getElementById('setting-display-name').value.trim();
      if (newName) {
        let names = getDisplayNames();
        names[currentUser] = newName;
        saveDisplayNames(names);
        updateHeaderAndProfile();
        renderUserList();
        alert("Görünen adınız güncellendi!");
      }
    }

    function updateHeartbeat() {
      if (!currentUser) return;
      const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
      onlineData[currentUser] = Date.now();
      localStorage.setItem('online_users', JSON.stringify(onlineData));
    }

    function isUserOnline(username) {
      const onlineData = JSON.parse(localStorage.getItem('online_users') || '{}');
      return onlineData[username] && (Date.now() - onlineData[username]) < 5000;
    }

    function getStorageKeyFor(target) {
      if (target === 'genel') return 'chat_messages_genel';
      return 'chat_messages_private_' + [currentUser, target].sort().join('_');
    }

    function selectChat(target) {
      activeTarget = target;
      if (unreadCounts[activeTarget]) unreadCounts[activeTarget] = 0;
      renderUserList();

      let headerName = target === 'genel' ? "E-Ticaret Sohbeti" : getDisplayNameFor(target).toUpperCase();
      let headerAvatar = headerName.charAt(0);
      let statusText = target === 'genel' ? "● Genel Kanal" : (isUserOnline(target) ? "● Çevrim İçi" : "● Çevrim Dışı");

      document.getElementById('chat-header-name').textContent = headerName;
      document.getElementById('chat-header-avatar').textContent = headerAvatar;
      document.getElementById('chat-header-status').textContent = statusText;

      loadMessages();
    }

    function renderUserList() {
      const listContainer = document.getElementById('users-list');
      const users = getUsers();
      let html = '';

      html += `
        <div class="chat-item ${activeTarget === 'genel' ? 'active' : ''}" onclick="selectChat('genel')">
          <div class="chat-item-avatar">E<div class="status-dot online"></div></div>
          <div class="chat-item-info">
            <div class="chat-item-name">E-Ticaret Sohbeti</div>
            <div class="chat-item-lastmsg">Genel kanal</div>
          </div>
        </div>
      `;

      Object.keys(users).forEach(user => {
        if (user !== currentUser) {
          let online = isUserOnline(user);
          let displayName = getDisplayNameFor(user);
          html += `
            <div class="chat-item ${activeTarget === user ? 'active' : ''}" onclick="selectChat('${user}')">
              <div class="chat-item-avatar">${displayName.charAt(0).toUpperCase()}<div class="status-dot ${online ? 'online' : 'offline'}"></div></div>
              <div class="chat-item-info">
                <div class="chat-item-name">${displayName.toUpperCase()}</div>
                <div class="chat-item-lastmsg">${online ? 'Çevrim içi' : 'Çevrim dışı'}</div>
              </div>
            </div>
          `;
        }
      });
      listContainer.innerHTML = html;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const key = getStorageKeyFor(activeTarget);
      let messages = JSON.parse(localStorage.getItem(key) || '[]');
      messages.push({
        user: currentUser,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      localStorage.setItem(key, JSON.stringify(messages));
      input.value = '';
      loadMessages();
    }

    function loadMessages() {
      const key = getStorageKeyFor(activeTarget);
      let messages = JSON.parse(localStorage.getItem(key) || '[]');
      const container = document.getElementById('message-list');
      let html = '';

      messages.forEach((msg) => {
        let isMine = (msg.user === currentUser);
        html += `
          <div class="message-row ${isMine ? 'mine' : 'other'}">
            <div class="message-content-wrapper">
              <div class="bubble">${escapeHtml(msg.text)}</div>
            </div>
            <div class="time-stamp">${msg.time}</div>
          </div>
        `;
      });
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    function pollData() {
      if (!currentUser) return;
      renderUserList();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderCustomGroups() {
      const groups = JSON.parse(localStorage.getItem('app_custom_groups') || '[]');
      document.getElementById('custom-groups-container').innerHTML = groups.map(g => `<div class="generic-list-item"><i class="fa-solid fa-user-group"></i><div><div style="font-weight: bold;">${g}</div></div></div>`).join('');
    }

    function addNewGroup() {
      const input = document.getElementById('new-group-name');
      if (input.value.trim()) {
        let groups = JSON.parse(localStorage.getItem('app_custom_groups') || '[]');
        groups.push(input.value.trim());
        localStorage.setItem('app_custom_groups', JSON.stringify(groups));
        input.value = '';
        renderCustomGroups();
      }
    }

    function renderContactsPanel() {
      const users = getUsers();
      let html = '';
      Object.keys(users).forEach(user => {
        if (user !== currentUser) {
          let online = isUserOnline(user);
          let displayName = getDisplayNameFor(user);
          html += `<div class="generic-list-item" onclick="switchTab('chat'); selectChat('${user}');" style="cursor:pointer;"><i class="fa-solid fa-circle-user"></i><div><div style="font-weight: bold;">${displayName.toUpperCase()}</div><div style="font-size: 12px; color: ${online ? '#22c55e' : '#64748b'}">${online ? '● Çevrim İçi' : '● Çevrim Dışı'}</div></div></div>`;
        }
      });
      document.getElementById('contacts-list-container').innerHTML = html;
    }

    // --- GERÇEK SESLİ VE GÖRÜNTÜLÜ ARAMA ALTYAPISI (WebRTC) ---
    const callModal = document.getElementById('call-modal');
    const videoPreview = document.getElementById('video-preview');
    const callTitle = document.getElementById('call-title');
    const audioVisualizerText = document.getElementById('audio-visualizer-text');

    // 1. Sesli Arama Tuşu
    document.getElementById('audioCallBtn').addEventListener('click', async () => {
      callTitle.textContent = "Canlı Sesli Görüşme";
      videoPreview.style.display = 'none'; // Sadece ses olduğu için video gizlenir
      audioVisualizerText.style.display = 'block';
      callModal.style.display = 'flex';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        alert("Mikrofon izni alınamadı veya mikrofon bulunamadı!");
        endCall();
      }
    });

    // 2. Görüntülü Arama Tuşu
    document.getElementById('videoCallBtn').addEventListener('click', async () => {
      callTitle.textContent = "Canlı Görüntülü Görüşme";
      videoPreview.style.display = 'block';
      audioVisualizerText.style.display = 'none';
      callModal.style.display = 'flex';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        videoPreview.srcObject = localStream;
      } catch (err) {
        alert("Kamera veya mikrofon izni alınamadı!");
        endCall();
      }
    });

    // Aramayı Sonlandır / Kapat
    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      videoPreview.srcObject = null;
      callModal.style.display = 'none';
    }

    // Üst Üste Üç Nokta Menü Kontrolü
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    window.addEventListener('click', () => {
      if (!dropdownMenu.classList.contains('hidden')) dropdownMenu.classList.add('hidden');
    });

    document.getElementById('renameBtn').addEventListener('click', () => {
      const headerNameElem = document.getElementById('chat-header-name');
      const newName = prompt("Bu sohbet için yeni bir isim girin:", headerNameElem.innerText);
      if (newName && newName.trim() !== "") {
        headerNameElem.innerText = newName.trim();
      }
    });

    document.getElementById('deleteChatBtn').addEventListener('click', () => {
      if (confirm("Bu sohbet geçmişini silmek istediğinize emin misiniz?")) {
        localStorage.removeItem(getStorageKeyFor(activeTarget));
        loadMessages();
      }
    });

    document.getElementById('blockUserBtn').addEventListener('click', () => {
      if (confirm("Bu kullanıcıyı engellemek istediğinize emin misiniz?")) {
        alert("Kullanıcı engellendi.");
      }
    });
  </script>

</body>
</html>
